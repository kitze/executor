# Deployed by Coolify (project: executor) on beast. Builds apps/host-selfhost/Dockerfile from this checkout
# (branch coolify-deploy = the pop-os production commit 0c0908a3d + bun pinned to the version that ran there).
services:
  executor:
    build:
      context: .
      dockerfile: apps/host-selfhost/Dockerfile
    container_name: executor
    restart: unless-stopped
    extra_hosts:
      # Tailnet DNS is not available inside the application network.
      - "mac-studio.chicken-galaxy.ts.net:100.70.214.114"
    volumes:
      - executor-data:/data
volumes:
  executor-data:
